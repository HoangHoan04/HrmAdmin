<nz-card
  [nzTitle]="(isEdit ? 'system.webhook.editTitle' : 'system.webhook.addTitle') | translate"
>
  <nz-spin [nzSpinning]="loading">
    <form nz-form [formGroup]="validateForm" nzLayout="vertical" (ngSubmit)="submitForm()">
      <div nz-row [nzGutter]="16">
        <div nz-col nzXs="24" nzMd="12">
          <nz-form-item>
            <nz-form-label nzRequired>{{ 'system.webhook.name' | translate }}</nz-form-label>
            <nz-form-control><input nz-input formControlName="name" /></nz-form-control>
          </nz-form-item>
        </div>
        <div nz-col nzXs="24" nzMd="12">
          <nz-form-item>
            <nz-form-label>{{ 'common.status.label' | translate }}</nz-form-label>
            <nz-form-control><nz-switch formControlName="isActive"></nz-switch></nz-form-control>
          </nz-form-item>
        </div>
        <div nz-col nzXs="24" nzMd="24">
          <nz-form-item>
            <nz-form-label nzRequired>{{ 'system.webhook.url' | translate }}</nz-form-label>
            <nz-form-control><input nz-input formControlName="url" /></nz-form-control>
          </nz-form-item>
        </div>
        <div nz-col nzXs="24" nzMd="12">
          <nz-form-item>
            <nz-form-label nzRequired>{{ 'system.webhook.eventTypes' | translate }}</nz-form-label>
            <nz-form-control>
              <input
                nz-input
                formControlName="eventTypes"
                [placeholder]="'system.webhook.eventTypesPlaceholder' | translate"
              />
            </nz-form-control>
          </nz-form-item>
        </div>
        <div nz-col nzXs="24" nzMd="12">
          <nz-form-item>
            <nz-form-label>{{ 'system.webhook.secret' | translate }}</nz-form-label>
            <nz-form-control><input nz-input formControlName="secret" /></nz-form-control>
          </nz-form-item>
        </div>
      </div>
      <nz-form-item>
        <nz-form-label>{{ 'common.fields.note' | translate }}</nz-form-label>
        <nz-form-control>
          <textarea nz-input rows="3" formControlName="note"></textarea>
        </nz-form-control>
      </nz-form-item>
      <div style="margin-top: 16px">
        <button nz-button type="button" (click)="goBack()">
          {{ 'common.actions.cancel' | translate }}
        </button>
        <button
          nz-button
          nzType="primary"
          type="submit"
          [nzLoading]="submitting"
          style="margin-left: 8px"
        >
          {{ 'common.actions.save' | translate }}
        </button>
      </div>
    </form>
  </nz-spin>
</nz-card>
