<nz-card
  [nzTitle]="
    (isEdit ? 'training.material.editTitle' : 'training.material.addTitle') | translate
  "
>
  <nz-spin [nzSpinning]="loading">
    <form nz-form [formGroup]="validateForm" nzLayout="vertical" (ngSubmit)="submitForm()">
      <div nz-row [nzGutter]="16">
        <div nz-col nzXs="24" nzMd="8">
          <nz-form-item>
            <nz-form-label nzRequired>{{ 'training.material.course' | translate }}</nz-form-label>
            <nz-form-control>
              <nz-select formControlName="courseId" style="width: 100%" nzShowSearch>
                @for (c of courses; track c.id) {
                  <nz-option [nzValue]="c.id" [nzLabel]="c.code + ' - ' + c.name"></nz-option>
                }
              </nz-select>
            </nz-form-control>
          </nz-form-item>
        </div>
        <div nz-col nzXs="24" nzMd="8">
          <nz-form-item>
            <nz-form-label nzRequired>{{ 'training.material.name' | translate }}</nz-form-label>
            <nz-form-control><input nz-input formControlName="name" /></nz-form-control>
          </nz-form-item>
        </div>
        <div nz-col nzXs="24" nzMd="8">
          <nz-form-item>
            <nz-form-label nzRequired>{{
              'training.material.displayOrder' | translate
            }}</nz-form-label>
            <nz-form-control>
              <nz-input-number
                formControlName="displayOrder"
                [nzMin]="0"
                style="width: 100%"
              ></nz-input-number>
            </nz-form-control>
          </nz-form-item>
        </div>
        <div nz-col nzXs="24" nzMd="16">
          <nz-form-item>
            <nz-form-label nzRequired>{{ 'training.material.fileUrl' | translate }}</nz-form-label>
            <nz-form-control>
              <app-file-upload
                formControlName="fileUrl"
                mode="document"
                accept="*/*"
                [maxSizeMb]="20"
                [showUrlInput]="true"
              ></app-file-upload>
            </nz-form-control>
          </nz-form-item>
        </div>
      </div>
      <div style="margin-top: 16px">
        <button nz-button type="button" (click)="goBack()">
          {{ 'common.actions.cancel' | translate }}
        </button>
        <button
          nz-button
          nzType="primary"
          type="submit"
          [nzLoading]="submitting"
          style="margin-left: 8px"
        >
          {{ 'common.actions.save' | translate }}
        </button>
      </div>
    </form>
  </nz-spin>
</nz-card>
