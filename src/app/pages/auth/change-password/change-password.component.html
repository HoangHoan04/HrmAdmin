<div class="login-welcome">
  <h1 class="login-title">{{ 'auth.changePasswordTitle' | translate }}</h1>
  <p class="login-subtitle">{{ 'auth.changePasswordDesc' | translate }}</p>
</div>

<form (ngSubmit)="onSubmit()" class="login-form" #changePasswordForm="ngForm">
  @if (error) {
    <div class="login-alert">
      <span nz-icon nzType="warning" nzTheme="fill"></span>
      <span>{{ error }}</span>
    </div>
  }

  <div class="login-field">
    <label class="login-label" for="oldPassword">{{ 'auth.oldPassword' | translate }}</label>
    <input
      nz-input
      id="oldPassword"
      type="password"
      [(ngModel)]="oldPassword"
      name="oldPassword"
      [placeholder]="'auth.oldPasswordPlaceholder' | translate"
      required
      class="login-input-wrap"
    />
  </div>

  <div class="login-field">
    <label class="login-label" for="newPassword">{{ 'auth.newPassword' | translate }}</label>
    <input
      nz-input
      id="newPassword"
      type="password"
      [(ngModel)]="newPassword"
      name="newPassword"
      [placeholder]="'auth.passwordMinLength' | translate"
      required
      class="login-input-wrap"
    />
  </div>

  <div class="login-field">
    <label class="login-label" for="confirmPassword">{{
      'auth.confirmPassword' | translate
    }}</label>
    <input
      nz-input
      id="confirmPassword"
      type="password"
      [(ngModel)]="confirmPassword"
      name="confirmPassword"
      [placeholder]="'auth.confirmPasswordPlaceholder' | translate"
      required
      class="login-input-wrap"
    />
  </div>

  <button nz-button nzType="primary" nzBlock [nzLoading]="loading" class="login-btn">
    @if (!loading) {
      <span nz-icon nzType="save" nzTheme="outline"></span>
    }
    <span>{{ 'auth.updatePassword' | translate }}</span>
  </button>

  <div class="login-footer-text">
    <a (click)="goBack()" class="create-account-link">{{ 'auth.skipAndGoHome' | translate }}</a>
  </div>
</form>
