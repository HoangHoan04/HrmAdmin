<nz-card [nzTitle]="'system.retention.title' | translate">
  <nz-spin [nzSpinning]="loading">
    <form nz-form [formGroup]="validateForm" nzLayout="vertical" (ngSubmit)="submitForm()">
      <div nz-row [nzGutter]="16">
        <div nz-col nzXs="24" nzMd="12">
          <nz-form-item>
            <nz-form-label nzRequired>{{
              'system.retention.softDeleteRetentionDays' | translate
            }}</nz-form-label>
            <nz-form-control>
              <nz-input-number
                formControlName="softDeleteRetentionDays"
                [nzMin]="1"
                style="width: 100%"
              ></nz-input-number>
            </nz-form-control>
          </nz-form-item>
        </div>
        <div nz-col nzXs="24" nzMd="12">
          <nz-form-item>
            <nz-form-label>{{ 'system.retention.isPurgeEnabled' | translate }}</nz-form-label>
            <nz-form-control>
              <nz-switch formControlName="isPurgeEnabled"></nz-switch>
            </nz-form-control>
          </nz-form-item>
        </div>
      </div>
      <nz-form-item>
        <nz-form-label>{{ 'common.fields.note' | translate }}</nz-form-label>
        <nz-form-control>
          <textarea nz-input rows="3" formControlName="note"></textarea>
        </nz-form-control>
      </nz-form-item>
      @if (canManage) {
        <div style="margin-top: 16px">
          <button nz-button nzType="primary" type="submit" [nzLoading]="submitting">
            {{ 'common.actions.save' | translate }}
          </button>
        </div>
      }
    </form>
  </nz-spin>
</nz-card>
