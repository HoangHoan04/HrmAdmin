<p style="margin: 0 0 12px; color: rgba(0, 0, 0, 0.45)">
  {{ 'recruitment.source.priorityHint' | translate }}
</p>

<app-filter-custom
  [id]="'hiring-source-filter'"
  [fields]="filterFields"
  [filters]="filters"
  [config]="filterConfig"
  [filterActions]="filterActions"
  [loading]="loading"
  (filtersChange)="onFiltersChange($event)"
></app-filter-custom>

<app-table-custom
  [id]="'hiring-source-table'"
  [data]="data"
  [columns]="columns"
  [loading]="loading"
  [showIndexList]="true"
  [stripedRows]="true"
  [rowActions]="rowActions"
  [toolbarActions]="toolbarActions"
  [pagination]="pagination"
  (pageChange)="onPageChange($event)"
  (refresh)="loadData()"
></app-table-custom>
