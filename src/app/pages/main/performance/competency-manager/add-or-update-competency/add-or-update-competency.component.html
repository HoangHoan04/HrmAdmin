<nz-card
  [nzTitle]="
    (isEdit ? 'performance.competency.editTitle' : 'performance.competency.addTitle') | translate
  "
>
  <nz-spin [nzSpinning]="loading">
    <form nz-form [formGroup]="validateForm" nzLayout="vertical" (ngSubmit)="submitForm()">
      <div nz-row [nzGutter]="16">
        <div nz-col nzXs="24" nzMd="8">
          <nz-form-item>
            <nz-form-label nzRequired>{{ 'performance.competency.code' | translate }}</nz-form-label>
            <nz-form-control
              ><input nz-input formControlName="code" [disabled]="isEdit"
            /></nz-form-control>
          </nz-form-item>
        </div>
        <div nz-col nzXs="24" nzMd="8">
          <nz-form-item>
            <nz-form-label nzRequired>{{ 'performance.competency.name' | translate }}</nz-form-label>
            <nz-form-control><input nz-input formControlName="name" /></nz-form-control>
          </nz-form-item>
        </div>
        <div nz-col nzXs="24" nzMd="8">
          <nz-form-item>
            <nz-form-label>{{ 'performance.common.company' | translate }}</nz-form-label>
            <nz-form-control>
              <nz-select formControlName="companyId" nzAllowClear style="width: 100%" nzShowSearch>
                @for (c of companies; track c.id) {
                  <nz-option
                    [nzValue]="c.id"
                    [nzLabel]="c.code ? c.code + ' - ' + c.name : c.name"
                  ></nz-option>
                }
              </nz-select>
            </nz-form-control>
          </nz-form-item>
        </div>
        <div nz-col nzXs="24" nzMd="8">
          <nz-form-item>
            <nz-form-label>{{ 'performance.common.isActive' | translate }}</nz-form-label>
            <nz-form-control><nz-switch formControlName="isActive"></nz-switch></nz-form-control>
          </nz-form-item>
        </div>
      </div>
      <nz-form-item>
        <nz-form-label>{{ 'performance.competency.description' | translate }}</nz-form-label>
        <nz-form-control>
          <textarea nz-input rows="3" formControlName="description"></textarea>
        </nz-form-control>
      </nz-form-item>
      <div style="margin-top: 16px">
        <button nz-button type="button" (click)="goBack()">
          {{ 'common.actions.cancel' | translate }}
        </button>
        <button
          nz-button
          nzType="primary"
          type="submit"
          [nzLoading]="submitting"
          style="margin-left: 8px"
        >
          {{ 'common.actions.save' | translate }}
        </button>
      </div>
    </form>
  </nz-spin>
</nz-card>
