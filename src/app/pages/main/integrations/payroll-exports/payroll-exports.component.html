<nz-card [nzTitle]="'system.integrations.payrollExportsTitle' | translate">
  <p>{{ 'system.integrations.payrollExportsDesc' | translate }}</p>
  <form nz-form [formGroup]="form" nzLayout="inline" style="margin-bottom: 16px">
    <nz-form-item>
      <nz-form-label nzRequired>{{ 'system.integrations.periodYear' | translate }}</nz-form-label>
      <nz-form-control>
        <nz-input-number formControlName="periodYear" [nzMin]="2000"></nz-input-number>
      </nz-form-control>
    </nz-form-item>
    <nz-form-item>
      <nz-form-label nzRequired>{{ 'system.integrations.periodMonth' | translate }}</nz-form-label>
      <nz-form-control>
        <nz-input-number formControlName="periodMonth" [nzMin]="1" [nzMax]="12"></nz-input-number>
      </nz-form-control>
    </nz-form-item>
  </form>

  <div style="display: flex; gap: 12px; flex-wrap: wrap">
    <button nz-button nzType="primary" [nzLoading]="loadingBank" (click)="exportBank()">
      {{ 'system.integrations.exportBank' | translate }}
    </button>
    <button nz-button nzType="default" [nzLoading]="loadingBhxh" (click)="exportBhxh()">
      {{ 'system.integrations.exportBhxh' | translate }}
    </button>
    <button nz-button nzType="default" [nzLoading]="loadingAccounting" (click)="exportAccounting()">
      {{ 'system.integrations.exportAccounting' | translate }}
    </button>
  </div>
</nz-card>
