<div class="sso-gateway-container">
  <div class="gateway-header">
    <div class="gateway-logo-badge">
      <span nz-icon nzType="safety-certificate" nzTheme="fill"></span>
    </div>
    <h1 class="gateway-title">HRM Enterprise</h1>
    <p class="gateway-subtitle">Hệ thống Quản trị Nhân sự & Tiền lương</p>
  </div>

  <div class="gateway-actions">
    <button
      nz-button
      nzType="primary"
      nzBlock
      nzSize="large"
      [nzLoading]="redirecting"
      (click)="redirectToSso()"
      class="sso-login-btn"
    >
      @if (!redirecting) {
        <span nz-icon nzType="login" nzTheme="outline"></span>
      }
      <span>Chuyển đến Cổng Đăng Nhập SSO</span>
    </button>
  </div>

  <div class="gateway-footer">
    <span nz-icon nzType="lock" nzTheme="outline"></span>
    <span>Xác thực mã hóa an toàn chuẩn OAuth2 & JWT RS256</span>
  </div>
</div>
