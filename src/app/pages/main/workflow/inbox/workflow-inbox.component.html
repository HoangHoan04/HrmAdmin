<nz-card [nzTitle]="'workflow.inbox.title' | translate">
  <app-table-custom
    [id]="'workflow-inbox-table'"
    [data]="data"
    [columns]="columns"
    [loading]="loading"
    [showIndexList]="true"
    [stripedRows]="true"
    [rowActions]="rowActions"
    [pagination]="pagination"
    (refresh)="loadData()"
  ></app-table-custom>
</nz-card>
