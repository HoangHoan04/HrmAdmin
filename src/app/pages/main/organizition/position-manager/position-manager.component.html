<nz-tabs
  [nzSelectedIndex]="activeTabKey === 'position' ? 0 : 1"
  (nzSelectedIndexChange)="onTabChange($event)"
  nzType="card"
>
  <nz-tab [nzTitle]="'organization.position.tabPosition' | translate">
    <app-position></app-position>
  </nz-tab>

  <nz-tab [nzTitle]="'organization.positionMaster.tabTitle' | translate">
    <app-position-master></app-position-master>
  </nz-tab>
</nz-tabs>
